# Shadows
shadow = false;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Border radius
corner-radius = 12;

# Engine
backend = "glx";

# Visual
dithered-present = true;
vsync = true;

animations = (
  {
    triggers = [ "geometry" ];
    offset-x = {
      curve = "cubic-bezier(0.165, 0.84, 0.44, 1)";
      duration = 0.35;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.165, 0.84, 0.44, 1)";
      duration = 0.35;
      start = "window-y-before - window-y";
      end = 0;
    };
  },
  {
    triggers = [ "open", "show" ];
    scale-x = {
      curve = "cubic-bezier(0.165, 0.84, 0.44, 1)";
      duration = 0.4;
      start = 0.85;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    opacity = {
      curve = "cubic-bezier(0.165, 0.84, 0.44, 1)";
      duration = 0.35;
      start = 0;
      end = "window-raw-opacity";
    };
  },
  {
    triggers = [ "close", "hide" ];
    scale-x = {
      curve = "cubic-bezier(0.165, 0.84, 0.44, 1)";
      duration = 0.35;
      start = 1;
      end = 0.85;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    opacity = {
      curve = "cubic-bezier(0.165, 0.84, 0.44, 1)";
      duration = 0.3;
      start = "window-raw-opacity-before";
      end = 0;
    };
  }
);
