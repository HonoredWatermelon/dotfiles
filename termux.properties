# Disable third party
allow-external-apps = false

# Toast icon
disable-terminal-session-change-toast = true

# Show keyboard
hide-soft-keyboard-on-startup = false

# Scrollback and cursor
terminal-transcript-rows = 1000
terminal-cursor-blink-rate = 0
terminal-cursor-style = block

# Keys layout
extra-keys = [['ESC','/','-','~','UP','^','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

# UI
fullscreen = true
use-black-ui = true

# Bell and volume keys
bell-character = ignore
volume-keys = volume

# Margin
terminal-margin-horizontal = 0
terminal-margin-vertical = 0
